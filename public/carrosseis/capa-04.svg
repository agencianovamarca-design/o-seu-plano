<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#0A0F1A"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="vg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0F1A" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0A0F1A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0F1A" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ag4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFA300"/>
      <stop offset="100%" stop-color="#FFD080"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#vg4)"/>

  <!-- Subtle dot pattern -->
  <pattern id="dots4" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#F5F2EC" fill-opacity="0.03"/>
  </pattern>
  <rect width="1080" height="1080" fill="url(#dots4)"/>

  <!-- Logo bars -->
  <rect x="64" y="114" width="11" height="22" rx="3" fill="#FFA300"/>
  <rect x="85" y="99" width="11" height="37" rx="3" fill="#FFA300"/>
  <rect x="106" y="83" width="11" height="53" rx="3" fill="#FFA300"/>
  <rect x="127" y="64" width="11" height="72" rx="3" fill="#FFA300"/>

  <!-- Brand name -->
  <text x="154" y="105.75999999999999" font-family="Impact,'Arial Black',sans-serif" font-size="36" font-weight="bold" fill="#F5F2EC" fill-opacity="0.9" letter-spacing="3">O SEU PLANO</text>
  <text x="154" y="124.47999999999999" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#F5F2EC" fill-opacity="0.35" letter-spacing="4">ESTRATÉGIA DIGITAL</text>

  <!-- Category badge -->
  <rect x="811" y="56" width="209" height="44" rx="8" fill="rgba(255,163,0,0.14)" stroke="rgba(255,163,0,0.3)" stroke-width="1"/>
  <text x="915.5" y="84" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#FFA300" text-anchor="middle" letter-spacing="2">TRANSFORMAÇÃO</text>

  <!-- Slide number -->
  <text x="64" y="560" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#F5F2EC" fill-opacity="0.2" letter-spacing="3">CARROSSEL 04 / 30</text>

  <!-- Title lines -->
  <text x="64" y="680" font-family="Impact,'Arial Black',sans-serif" font-size="108" font-weight="bold" fill="#F5F2EC" fill-opacity="1" text-anchor="start">Antes e depois de estruturar</text>
  <text x="64" y="800.96" font-family="Impact,'Arial Black',sans-serif" font-size="108" font-weight="bold" fill="#F5F2EC" fill-opacity="1" text-anchor="start">a presença digital.</text>

  <!-- Subtitle lines -->
  <text x="64" y="945.9200000000001" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="normal" fill="#F5F2EC" fill-opacity="0.45" text-anchor="start">A mesma empresa.</text>
  <text x="64" y="992.96" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="normal" fill="#F5F2EC" fill-opacity="0.45" text-anchor="start">Resultado completamente diferente.</text>

  <!-- Accent bar at bottom -->
  <rect x="0" y="1074" width="1080" height="6" fill="url(#ag4)"/>

  <!-- Slide count hint -->
  <text x="1016" y="1050" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#F5F2EC" fill-opacity="0.18" text-anchor="end">1 /</text>
</svg>